<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Olympiad Exam Archive — Liquid Glass UI</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css" />

  <meta name="description" content="Tuyển tập đề thi Olympiad - Math, Informatics, Physics. Giao diện Liquid Glass / Modern Dark Mode." />
</head>
<body class="bg-[#0f172a] text-slate-100 antialiased">

  <!-- Sticky glass header -->
  <header class="sticky top-0 z-40 p-4">
    <div class="container mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <button id="sidebarToggle" class="md:hidden p-2 glass-btn" aria-label="Toggle sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="flex items-center gap-3">
          <div class="logo glass-pill flex items-center gap-3 px-3 py-2">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-violet-400 flex items-center justify-center shadow-md">
              <i class="fa-solid fa-flask text-white"></i>
            </div>
            <div>
              <div class="text-sm font-semibold">Olympiad Archive</div>
              <div class="text-xs text-slate-300">Math • Informatics • Physics</div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex-1 px-4">
        <div class="glass-search mx-auto max-w-3xl flex items-center gap-3 px-3 py-2">
          <i class="fa-solid fa-magnifying-glass text-slate-300"></i>
          <input id="searchInput" type="search" placeholder="Tìm theo tiêu đề, năm, hoặc từ khóa..." class="bg-transparent outline-none w-full text-sm" aria-label="Tìm kiếm đề thi" />
          <button id="clearSearch" class="text-slate-400 hover:text-white text-sm hidden"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <div class="hidden md:flex items-center gap-3">
        <a href="#" class="glass-pill px-3 py-2 text-sm">Upload (coming)</a>
        <a href="#" class="glass-pill px-3 py-2 text-sm"><i class="fa-regular fa-circle-user mr-2"></i>Account</a>
      </div>
    </div>
  </header>

  <!-- Main layout -->
  <main class="container mx-auto p-4">
    <div class="flex gap-6">
      <!-- Sidebar -->
      <aside id="sidebar" class="w-72 shrink-0 glass-sidebar p-4 hidden md:block">
        <h3 class="text-sm font-semibold mb-3">Bộ lọc</h3>

        <!-- Subject -->
        <div class="mb-4">
          <div class="text-xs text-slate-300 mb-2">Môn</div>
          <div id="subjectFilters" class="flex flex-col gap-2">
            <button class="subject-pill glass-pill active" data-subject="">Tất cả</button>
            <button class="subject-pill glass-pill" data-subject="Math">Math</button>
            <button class="subject-pill glass-pill" data-subject="Informatics">Informatics</button>
            <button class="subject-pill glass-pill" data-subject="Physics">Physics</button>
          </div>
        </div>

        <!-- Categories (dynamic) -->
        <div class="mb-4">
          <div class="text-xs text-slate-300 mb-2">Giải / Kỳ thi</div>
          <div id="categoryFilters" class="flex flex-wrap gap-2">
            <!-- pills rendered by JS -->
          </div>
        </div>

        <div class="mt-6 flex gap-2">
          <button id="clearFilters" class="glass-btn px-3 py-2 w-full">Xóa bộ lọc</button>
        </div>

        <div class="mt-6 text-xs text-slate-400">
          Giao diện: Liquid Glass / Modern Dark Mode — Responsive
        </div>
      </aside>

      <!-- Main content -->
      <section class="flex-1">
        <!-- summary / controls -->
        <div class="mb-4 flex items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-semibold">Danh sách đề thi</h2>
            <div id="resultsSummary" class="text-sm text-slate-400 mt-1">Đang tải dữ liệu...</div>
          </div>

          <div class="flex items-center gap-2">
            <label class="text-sm text-slate-300 mr-2">Sắp xếp:</label>
            <select id="sortSelect" class="glass-pill px-3 py-2 text-sm">
              <option value="yearDesc">Năm giảm dần</option>
              <option value="yearAsc">Năm tăng dần</option>
              <option value="titleAsc">Tiêu đề A→Z</option>
            </select>
          </div>
        </div>

        <!-- grid -->
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- cards rendered by JS -->
        </div>

        <!-- empty state -->
        <div id="emptyState" class="hidden mt-8 text-center text-slate-400">
          <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
          <div class="text-lg">Không tìm thấy đề thi phù hợp.</div>
        </div>
      </section>
    </div>
  </main>

  <!-- PDF Modal -->
  <div id="pdfModal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 backdrop-blur-xl bg-black/60" data-close="true"></div>
    <div class="relative w-[92%] h-[90%] max-w-6xl glass-modal p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-file-pdf text-2xl text-red-400"></i>
          <div>
            <div id="modalTitle" class="font-semibold"></div>
            <div id="modalMeta" class="text-sm text-slate-300"></div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a id="downloadPdf" class="glass-pill px-3 py-2 text-sm" download><i class="fa-solid fa-download mr-2"></i>Tải</a>
          <button id="closeModal" class="glass-btn px-3 py-2" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>

      <div class="h-[calc(100%-72px)] bg-black/60 rounded overflow-hidden flex">
        <div id="modalFileList" class="w-64 bg-black/30 p-3 overflow-auto border-r border-white/5">
          <!-- file items injected by JS -->
        </div>
        <div class="flex-1 bg-black/60">
          <iframe id="pdfFrame" src="" class="w-full h-full border-0" title="PDF Viewer"></iframe>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-slate-500 text-xs py-6">
    © <span id="yearNow"></span> Olympiad Archive — Liquid Glass UI
  </footer>

  <!-- App script -->
  <script src="app.js" type="module"></script>
</body>
</html>
