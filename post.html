<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Minh - Bài viết</title>
    <link rel="stylesheet" href="./Lộ trình - MarisaOJ_ Marisa Online Judge_files/font-awesome.min.css">
    <link rel="stylesheet" href="./Lộ trình - MarisaOJ_ Marisa Online Judge_files/css">
    <link rel="stylesheet" href="./Lộ trình - MarisaOJ_ Marisa Online Judge_files/css(1)">
    <link rel="stylesheet" href="./Lộ trình - MarisaOJ_ Marisa Online Judge_files/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <style>
        .site-header .logo-text { color: inherit; }
        .post-layout { display: grid; grid-template-columns: minmax(180px, 25%) minmax(0, 1fr); gap: 2em; align-items: start; }
        .post-layout > *, .post-article, .post-content { min-width: 0; }
        .toc { position: sticky; top: 1em; padding: 1em; background: #fffdaf; border: 2px solid #000; border-radius: 5px; }
        .toc h2 { margin-top: 0; font-size: 1.1em; }
        .toc ol { margin: 0; padding-left: 1.2em; }
        .toc li { margin: .45em 0; }
        .toc a { color: #000; text-decoration: none; }
        .toc a:hover { text-decoration: underline; }
        .toc .toc-h3 { margin-left: 1em; font-size: .9em; }
        .post-article h1 { margin-top: 0; border-bottom: 2px solid black; }
        .post-meta { color: #666; margin-bottom: 1.5em; }
        .post-content { line-height: 1.65; }
        .ascii-table { width: 100%; max-width: 36em; margin: 1em 0 1.5em; border-collapse: collapse; background: #fff; }
        .ascii-table th, .ascii-table td { padding: .55em .75em; border: 1px solid #888; text-align: left; }
        .ascii-table th { background: #fffdaf; }
        .post-content h2, .post-content h3 { scroll-margin-top: 1em; }
        .solution-details { margin: 1em 0; border: 2px solid #000; background: #fffdaf; }
        .solution-details summary { padding: .7em 1em; cursor: pointer; font-weight: bold; }
        .solution-details > p, .solution-details > .code-wrapper { margin: 0 1em 1em; }
        .post-content pre { position: relative; max-width: 100%; box-sizing: border-box; padding-top: 2.8em; background: #f5f5f5; overflow-x: auto; overflow-y: hidden; }
        .post-content pre code { display: block; width: max-content; min-width: 100%; white-space: pre; }
        .code-wrapper { position: relative; max-width: 100%; min-width: 0; overflow: hidden; }
        .copy-button { top: .5em; right: .5em; z-index: 1; padding: .4em .7em; border: 1px solid #888; background: #fff; cursor: pointer; }
        .copy-button.is-copied { background: #9acd32; }
        .back-link { display: inline-block; margin-bottom: 1em; color: #000; font-weight: bold; }
        .post-error { padding: 1em; border: 2px solid #a94442; color: #a94442; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-top: 2em; padding: .85em 1em; color: #b7c0cb; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; }
        .post-footer span { min-width: 0; }
        .post-authors { display: flex; flex-direction: column; gap: .2em; }
        .next-post { margin-top: 2em; padding: 1em; border: 2px solid #000; background: #fffdaf; box-shadow: 4px 4px 0 #000; }
        .next-post-label { margin: 0 0 .4em; color: #666; font-size: .85em; font-weight: bold; text-transform: uppercase; }
        .next-post-link { display: block; color: #008000; font-size: 1.15em; font-weight: bold; text-decoration: none; }
        .next-post-link:hover { text-decoration: underline; }
        .next-post-meta { margin: .35em 0 0; color: #555; }
        @media (max-width: 700px) {
            .post-layout { grid-template-columns: 1fr; }
            .toc { position: static; }
            .post-article { padding: 1em; }
            .post-article h1 { font-size: 1.7em; }
            .post-footer { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="site-header-container"><div></div></header>
    <div class="container">
        <div id="header" class="site-header">
            <div class="logo-container"><a href="index.html" aria-label="Le Minh trang chủ"><h1 class="logo-text">Le Minh</h1></a></div>
            <div id="user-info"><div class="auth-links">Ghi chú thực chiến, thuật toán C++ và chia sẻ kinh nghiệm Competitive Programming.</div></div>
        </div>
        <div class="nav-container">
            <ul id="parnav"><li id="navleft"><a class="nava aleft" href="index.html">TRANG CHỦ</a></li><li id="navleft"><a class="nava aleft" href="index.html#modules">MODULE</a></li><li id="navleft"><a class="nava aleft" href="index.html#editorial">EDITORIAL</a></li></ul>
            <main class="content-container">
                <a class="back-link" href="index.html">&larr; Quay lại danh sách bài viết</a>
                <div id="post-layout" class="post-layout" hidden>
                    <aside id="toc" class="toc" aria-label="Mục lục bài viết"><h2>Mục lục</h2><ol></ol></aside>
                    <article class="post-article">
                        <h1 id="post-title"></h1>
                        <div id="post-meta" class="post-meta"></div>
                        <div id="post-content" class="post-content"></div>
                        <footer id="post-footer" class="post-footer" hidden></footer>
                        <nav id="next-post" class="next-post" aria-label="Đọc tiếp" hidden></nav>
                    </article>
                </div>
                <div id="post-error" class="post-error" hidden>Không tìm thấy bài viết này.</div>
            </main>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
        (function () {
            "use strict";
            var query = new URLSearchParams(window.location.search);
            var postId = query.get("id");
            var editorialId = query.get("editorial");
            var layout = document.getElementById("post-layout");
            var errorBox = document.getElementById("post-error");
            var content = document.getElementById("post-content");
            var title = document.getElementById("post-title");
            var meta = document.getElementById("post-meta");
            var postFooter = document.getElementById("post-footer");
            var tocList = document.querySelector("#toc ol");
            var nextPostBox = document.getElementById("next-post");

            function slugify(value, index) {
                var slug = value.toLocaleLowerCase("vi").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
                return slug || "section-" + index;
            }

            function buildToc() {
                var usedIds = {};
                Array.prototype.forEach.call(content.querySelectorAll("h2, h3"), function (heading, index) {
                    var baseId = slugify(heading.textContent, index);
                    var id = baseId;
                    var suffix = 1;
                    while (usedIds[id]) id = baseId + "-" + suffix++;
                    usedIds[id] = true;
                    heading.id = id;
                    var item = document.createElement("li");
                    if (heading.tagName === "H3") item.className = "toc-h3";
                    var link = document.createElement("a");
                    link.href = "#" + id;
                    link.textContent = heading.textContent;
                    item.appendChild(link);
                    tocList.appendChild(item);
                });
            }

            function addCopyButtons() {
                content.querySelectorAll("pre").forEach(function (block) {
                    if (!block.querySelector("code")) return;
                    var wrapper = document.createElement("div");
                    wrapper.className = "code-wrapper";
                    block.parentNode.insertBefore(wrapper, block);
                    wrapper.appendChild(block);
                    var button = document.createElement("button");
                    button.className = "copy-button";
                    button.type = "button";
                    button.textContent = "Copy Code";
                    button.addEventListener("click", function () {
                        navigator.clipboard.writeText(block.textContent).then(function () {
                            button.textContent = "Đã copy";
                            button.classList.add("is-copied");
                            setTimeout(function () { button.textContent = "Copy Code"; button.classList.remove("is-copied"); }, 1500);
                        });
                    });
                    wrapper.appendChild(button);
                });
            }

            function escapeHtml(value) {
                return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
            }

            function renderLessonSections(sections) {
                return (sections || []).map(function (section) {
                    var paragraphs = (section.content || []).map(function (paragraph) {
                        return "<p>" + escapeHtml(paragraph) + "</p>";
                    }).join("");
                    var examples = (section.examples || []).map(function (example) {
                        return "<li><code>" + escapeHtml(example) + "</code></li>";
                    }).join("");
                    return "<details class=\"solution-details lesson-section\"><summary>" + escapeHtml(section.title) + "</summary><p>" + escapeHtml(section.summary || "") + "</p>" + paragraphs + (examples ? "<ul>" + examples + "</ul>" : "") + "</details>";
                }).join("");
            }

            function renderDryRun(dryRun) {
                if (!Array.isArray(dryRun)) return "<h2>Chạy tay (Dry-run)</h2><p>" + escapeHtml(dryRun) + "</p>";
                return "<h2>Chạy tay (Dry-run)</h2>" + dryRun.map(function (run) {
                    return "<details class=\"solution-details dry-run-section\"><summary>" + escapeHtml(run.title) + "</summary><ol>" + (run.steps || []).map(function (step) { return "<li>" + escapeHtml(step) + "</li>"; }).join("") + "</ol></details>";
                }).join("");
            }

            function renderCodeBlocks(lesson) {
                if (!Array.isArray(lesson.codeBlocks)) {
                    return "<h2>Khung Code C++ mẫu hoàn chỉnh</h2><details class=\"solution-details\"><summary>Hiện khung Code C++</summary><pre><code class=\"language-cpp\">" + escapeHtml(lesson.code) + "</code></pre></details>";
                }
                return "<h2>Khung Code C++ mẫu hoàn chỉnh</h2>" + lesson.codeBlocks.map(function (block) {
                    return "<details class=\"solution-details code-section\"><summary>" + escapeHtml(block.title) + "</summary><pre><code class=\"language-" + escapeHtml(block.language || "cpp") + "\">" + escapeHtml(block.code) + "</code></pre></details>";
                }).join("");
            }

            function lessonHtml(lesson) {
                var exercises = (lesson.exercises || []).map(function (exercise) {
                    if (typeof exercise === "object") {
                        return "<li><a href=\"" + escapeHtml(exercise.url) + "\">" + escapeHtml(exercise.name) + " - Xem Editorial</a>" + (exercise.originalUrl ? " <a href=\"" + escapeHtml(exercise.originalUrl) + "\" target=\"_blank\" rel=\"noopener\">Mở đề gốc ↗</a>" : "") + "</li>";
                    }
                    var match = (window.__EDITORIALS__ || []).find(function (editorial) {
                        return String(exercise).toLocaleLowerCase("vi").indexOf(String(editorial.problemCode).toLocaleLowerCase("vi") + " -") === 0;
                    });
                    if (!match) return "<li>" + escapeHtml(exercise) + "</li>";
                    return "<li><a href=\"post.html?editorial=" + encodeURIComponent(match.editorialId) + "\">" + escapeHtml(exercise) + " - Xem Editorial</a></li>";
                }).join("");
                var asciiTable = "";
                if (lesson.asciiTable) {
                    asciiTable = "<h2>Bảng mã ASCII tra cứu nhanh</h2><table class=\"ascii-table\"><thead><tr>" +
                        lesson.asciiTable[0].map(function (cell) { return "<th>" + escapeHtml(cell) + "</th>"; }).join("") +
                        "</tr></thead><tbody>" + lesson.asciiTable.slice(1).map(function (row) {
                            return "<tr>" + row.map(function (cell) { return "<td><code>" + escapeHtml(cell) + "</code></td>"; }).join("") + "</tr>";
                        }).join("") + "</tbody></table>";
                }
                var related = (window.__EDITORIALS__ || []).filter(function (editorial) {
                    var haystack = (editorial.category + " " + editorial.title).toLocaleLowerCase("vi");
                    return (lesson.tags || []).some(function (tag) { return haystack.indexOf(String(tag).toLocaleLowerCase("vi")) !== -1; });
                });
                var editorialLinks = related.map(function (editorial) {
                    return "<li><a href=\"post.html?editorial=" + encodeURIComponent(editorial.editorialId) + "\">Editorial: " + escapeHtml(editorial.source + " - " + editorial.title) + "</a></li>";
                }).join("");
                var concept = lesson.sections ? renderLessonSections(lesson.sections) : "<p>" + escapeHtml(lesson.concept) + "</p>";
                return "<h2>Khái niệm &amp; Tư duy cốt lõi</h2>" + concept + asciiTable +
                    renderDryRun(lesson.dryRun) + renderCodeBlocks(lesson) +
                    "<h2>Danh sách Bài tập Luyện tập</h2><ul>" + exercises + editorialLinks + "</ul>";
            }

            function editorialHtml(editorial) {
                var sampleInput = escapeHtml(editorial.sampleInput).replace(/\\n/g, "\n");
                var sampleOutput = escapeHtml(editorial.sampleOutput).replace(/\\n/g, "\n");
                return "<p><strong>Nguồn:</strong> " + escapeHtml(editorial.source) + "</p>" +
                    "<p><a href=\"" + escapeHtml(editorial.link) + "\" target=\"_blank\" rel=\"noopener\">Mở đề gốc trên Codeforces →</a></p>" +
                    "<h2>Đề bài tóm tắt</h2><p>" + escapeHtml(editorial.statement) + "</p>" +
                    "<h2>Input mẫu</h2><pre>" + sampleInput + "</pre>" +
                    "<h2>Output mẫu</h2><pre>" + sampleOutput + "</pre>" +
                    "<details class=\"solution-details\"><summary>Hint gợi ý (bấm để hiện)</summary><p>" + escapeHtml(editorial.hint || "Hãy tự xác định dạng bài, invariant và điều kiện biên trước khi xem phân tích.") + "</p></details>" +
                    "<details class=\"solution-details\"><summary>Phân tích thuật toán (bấm để hiện)</summary><h2>Phân tích thuật toán</h2><p>" + escapeHtml(editorial.analysis) + "</p>" +
                    "<p><strong>Algorithm:</strong> " + escapeHtml(editorial.algorithm || editorial.category) + " | <strong>Complexity:</strong> " + (String(editorial.complexity).indexOf("O(") === 0 ? "$" + escapeHtml(editorial.complexity) + "$" : escapeHtml(editorial.complexity)) + "</p>" +
                    "</details><h2>Chạy tay test ví dụ (Dry-run)</h2><p>" + escapeHtml(editorial.dryRun) + "</p>" +
                    "<h2>Code C++ lời giải hoàn chỉnh</h2><details class=\"solution-details\"><summary>Hiện Code C++ và nút Copy</summary><pre><code class=\"language-cpp\">" + escapeHtml(editorial.code) + "</code></pre></details>";
            }

            function renderNextPost(editorials, currentPost, currentEditorial) {
                var items = currentEditorial ? editorials : DATA.posts;
                var currentIndex = items.findIndex(function (item) {
                    return currentEditorial ? item.editorialId === currentEditorial.editorialId : item.id === currentPost.id;
                });
                if (!items.length || currentIndex < 0) return;
                var next = items[(currentIndex + 1) % items.length];
                var href = currentEditorial ? "post.html?editorial=" + encodeURIComponent(next.editorialId) : "post.html?id=" + encodeURIComponent(next.id);
                var nextTitle = currentEditorial ? next.title : next.title;
                var nextMeta = currentEditorial ? next.source + " | Rating " + next.rating : next.level;
                nextPostBox.innerHTML = "<p class=\"next-post-label\">Đọc tiếp bài viết sau</p><a class=\"next-post-link\"></a><p class=\"next-post-meta\"></p>";
                nextPostBox.querySelector(".next-post-link").href = href;
                nextPostBox.querySelector(".next-post-link").textContent = nextTitle + " →";
                nextPostBox.querySelector(".next-post-meta").textContent = nextMeta;
                nextPostBox.hidden = false;
            }

            function renderPostFooter(post) {
                var authors = Array.isArray(post.author) ? post.author : [post.author || "Le Minh"];
                postFooter.innerHTML = "<span class=\"post-authors\"></span>";
                postFooter.querySelector(".post-authors").innerHTML = authors.map(function (author) {
                    return "<span>👤 " + escapeHtml(author) + "</span>";
                }).join("");
                postFooter.hidden = false;
            }

            function showPost(editorials) {
                var post = DATA.posts.find(function (item) { return item.id === postId; });
                var editorial = editorials.find(function (item) { return item.editorialId === editorialId; });
                if (editorial) post = { title: editorial.source + " - " + editorial.title, level: "Editorial", author: editorial.author, tags: [editorial.category].concat(editorial.tags || []), content: editorialHtml(editorial) };
                if (!post) { errorBox.hidden = false; return; }
                title.textContent = post.title;
                meta.textContent = (post.level || "") + " | " + (post.tags || []).map(function (tag) { return "#" + tag; }).join(" ");
                content.innerHTML = post.content || lessonHtml(post);
                buildToc(); addCopyButtons(); Prism.highlightAllUnder(content);
                renderMathInElement(content, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }] });
                renderPostFooter(post);
                renderNextPost(editorials, post, editorial);
                document.title = "Le Minh - " + post.title;
                layout.hidden = false;
            }

            fetch("data/editorials/index.json").then(function (response) { return response.ok ? response.json() : { files: [] }; })
                .then(function (manifest) {
                    return Promise.all((manifest.files || []).map(function (file) {
                        return fetch("data/editorials/" + file).then(function (response) { return response.json(); });
                    }));
                })
                .catch(function () { return []; })
                .then(function (overrides) {
                    return fetch("data/lessons/index.json").then(function (response) { return response.ok ? response.json() : { files: [] }; })
                        .then(function (manifest) { return Promise.all((manifest.files || []).map(function (file) { return fetch("data/lessons/" + file).then(function (response) { return response.json(); }); })); })
                        .catch(function () { return []; })
                        .then(function (lessonOverrides) {
                            var lessonById = {};
                            lessonOverrides.forEach(function (lesson) { lessonById[lesson.id] = lesson; });
                            var allProblems = DATA.modules.reduce(function (all, module) { return all.concat(module.problems); }, []);
                            DATA.posts = DATA.posts.map(function (lesson) {
                                var merged = lessonById[lesson.id] ? Object.assign({}, lesson, lessonById[lesson.id]) : lesson;
                                merged.exercises = (merged.exercises || []).map(function (exercise) {
                                    if (typeof exercise === "object") return exercise;
                                    var item = allProblems.find(function (problem) { return problem.problemCode === String(exercise).split(" - ")[0]; });
                                    return item ? { id: "editorial-" + item.id, name: item.problemCode + " - " + item.title, rating: item.rating, tags: item.tags, url: "post.html?editorial=editorial-" + item.id, originalUrl: item.link } : { name: String(exercise), url: "" };
                                });
                                return merged;
                            });
                            var editorials = DATA.modules.reduce(function (all, module) { return all.concat(module.problems); }, []).map(function (item) {
                        var custom = overrides.find(function (entry) { return entry.problemCode === item.problemCode; });
                        return Object.assign({ editorialId: "editorial-" + item.id, title: item.problemCode + " - " + item.title, source: item.source, category: item.category, tags: item.tags, link: item.link, statement: item.statement, sampleInput: item.sampleInput, sampleOutput: item.sampleOutput, analysis: item.analysis, complexity: "Theo giới hạn bài toán", dryRun: item.dryRun, code: item.code }, custom || {});
                            });
                            window.__EDITORIALS__ = editorials;
                            showPost(editorials);
                        });
                });
        })();
    </script>
</body>
</html>
